<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Love 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 46%,#2d0a30 0%,#0e0517 55%,#05020a 100%);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.name{position:fixed;left:0;right:0;text-align:center;font-family:"Dancing Script","Brush Script MT",cursive;font-weight:700;font-size:clamp(34px,8.5vw,64px);line-height:1.15;letter-spacing:.02em;padding:0 16px;box-sizing:border-box;color:#ffe4ef;text-shadow:0 0 14px #ff3f8e,0 0 38px rgba(255,63,142,.65);pointer-events:none}
.name span{display:inline-block;opacity:0;transform:translateY(16px) scale(.9);transition:opacity .9s ease,transform .9s ease}
.name.show span{opacity:1;transform:none}
.song{z-index:5;font-family:inherit;cursor:pointer;position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#ffe4ef;font-size:14px;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.song:hover{background:rgba(255,255,255,.18)}
.song:focus-visible{outline:2px solid #ffb6d2;outline-offset:2px}

.pic{position:fixed;aspect-ratio:1/.95;padding:0;border:0;background:none;cursor:pointer;opacity:0;transform:scale(0) rotate(-25deg);transition:transform .9s cubic-bezier(.34,1.9,.5,1),opacity .4s,left 1.1s cubic-bezier(.2,.8,.3,1),top 1.1s cubic-bezier(.2,.8,.3,1)}
.pic.show{opacity:1;transform:scale(1) rotate(var(--t,0deg));transition-delay:var(--d,0s)}
.pic:focus-visible{outline:2px solid #ffb6d2;outline-offset:4px;border-radius:12px}
.pic .bt{position:absolute;inset:0;transform:scale(var(--b,1))}
.pic .in{position:absolute;inset:0;transform-origin:50% 90%;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,63,142,.75))}
.pic .bd{position:absolute;inset:0;background:linear-gradient(160deg,#ffd1e3,#ff3f8e);clip-path:url(#hc)}
.pic img{position:absolute;left:5%;top:5%;width:90%;height:90%;object-fit:cover;clip-path:url(#hc);pointer-events:none}

.pic .in::after{content:"";position:absolute;left:5%;top:5%;width:90%;height:90%;clip-path:url(#hc);background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:100% 0}55%,100%{background-position:0 0}}
.sp{position:absolute;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 2.2s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.15}50%{transform:scale(1) rotate(45deg);opacity:1}}
.fh{position:absolute;left:50%;top:42%;width:16px;height:15px;clip-path:url(#hc);pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.pic .in::after,.sp{animation:none}}
.pic.jig .in{animation:jig .7s ease}
@media (max-width:600px){.pic .in{filter:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
@keyframes jig{0%{transform:scale(1)}20%{transform:scale(1.28,.78)}40%{transform:scale(.84,1.22)}60%{transform:scale(1.12,.92)}80%{transform:scale(.96,1.05)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pic .in{animation:none}}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center;color:#f0cfe0;font-size:14px;letter-spacing:.02em;opacity:0;transition:opacity 1.2s;pointer-events:none}
.hint.on{opacity:.8}
</style>
</head>

var pics=[],shown=false;
function psz(){var m=Math.min(innerWidth,innerHeight);return Math.round(Math.max(112,Math.min(215,m*.3))*(.8+Math.random()*.4));}
function mk(idx,l,t,sz,tilt,dly){
  var b=document.createElement('button');b.type='button';b.className='pic';
  b.setAttribute('aria-label','Foto, ketuk untuk menambah foto');
  b.style.cssText='left:'+l+'%;top:'+t+'%;width:'+sz+'px;margin:'+(-sz*.475)+'px 0 0 '+(-sz/2)+'px;--t:'+tilt+'deg;--d:'+dly+'s';
  b.innerHTML='<span class="bt"><span class="in" style="animation-delay:'+(-Math.random()*3).toFixed(2)+'s"><span class="bd"></span></span><i class="sp" style="top:-4%;left:-3%;width:16px;height:16px"></i><i class="sp" style="bottom:12%;right:-6%;width:13px;height:13px;animation-delay:.9s"></i></span>';
  var im=new Image();im.alt='';im.src=PH[idx];b.querySelector('.in').appendChild(im);
  return b;
}
function spawn(l,t){
  if(pics.length>=(innerWidth<600?10:15)){var o=pics.shift();o.classList.remove('show');setTimeout(function(){o.remove()},900);}
  var n=mk(Math.floor(Math.random()*PH.length),l,t,psz(),Math.random()*20-10,0);
  document.body.appendChild(n);pics.push(n);
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    var a=Math.random()*6.283;
    n.style.left=Math.max(6,Math.min(94,50+Math.cos(a)*(36+Math.random()*10)))+'%';
    n.style.top=Math.max(8,Math.min(92,50+Math.sin(a)*(34+Math.random()*10)))+'%';
    n.classList.add('show');
  });});
}
var AN=innerHeight>=innerWidth?[[16,13],[84,22],[10,48],[90,56],[17,80],[84,84]]:[[10,22],[90,24],[7,52],[93,58],[12,84],[88,86]];
AN.forEach(function(a,i){var n=mk(i%PH.length,a[0],a[1],psz(),(i%2?1:-1)*(4+Math.random()*8),(i*.18).toFixed(2));document.body.appendChild(n);pics.push(n);});
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('.pic'):null;if(!b||pics.indexOf(b)<0)return;
  b.classList.remove('jig');void b.offsetWidth;b.classList.add('jig');setTimeout(function(){b.classList.remove('jig')},720);
  for(var j=0;j<9;j++){var hh=document.createElement('span');hh.className='fh';var an=Math.random()*6.283,dd=70+Math.random()*70;hh.style.setProperty('--dx',Math.cos(an)*dd+'px');hh.style.setProperty('--dy',(Math.sin(an)*dd-40)+'px');hh.style.setProperty('--r',(Math.random()*80-40)+'deg');hh.style.background=Math.random()<.5?'#ff5c9a':'#ffd1e3';b.appendChild(hh);(function(el){setTimeout(function(){el.remove()},1000)})(hh);}
  var l=parseFloat(b.style.left),t=parseFloat(b.style.top);for(var k=0;k<3;k++)spawn(l,t);
  if(typeof bgm!=='undefined'&&!auto&&!userPaused){auto=true;var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){});}
});
setTimeout(function(){hint.classList.add('on')},reduce?300:4200);
setTimeout(function(){hint.classList.remove('on')},12000);
cv.addEventListener('pointerdown',function(e){down=true;lx=e.clientX;ly=e.clientY;moved=0;dt0=performance.now();cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);vY=dx*.008;yaw+=dx*.008;pitch=Math.max(-1,Math.min(1,pitch+dy*.006));});
function up(){if(!down)return;down=false;
  if(moved<8&&performance.now()-dt0<400&&mode===0&&time-t0>4){mode=1;tb=time;}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',function(){down=false});
// 4. animasi
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(!down){var tg=Math.round(yaw/6.2832)*6.2832;yaw+=(tg-yaw)*.02+vY;vY*=.94;pitch+=(.06-pitch)*.03;}
  var ya=yaw+(reduce?0:Math.sin(time*.55)*.7);
  var el=time-t0,bt=time-tb;
  if(mode===1&&bt>=.8){mode=0;t0=time;el=0;}
  var amp=Math.max(0,Math.min(1,(el-3)/1.5));
  var pp=(time%1.2)/1.2, beat=Math.exp(-Math.pow((pp-.12)*14,2))+.6*Math.exp(-Math.pow((pp-.3)*14,2));
  var sc=1+.07*beat*amp*(mode===0?1:0);
  document.body.style.setProperty('--b',(1+.1*beat*amp).toFixed(3));
  var want=mode===0&&el>3.6;if(want!==shown){shown=want;for(var pi=0;pi<pics.length;pi++)pics[pi].classList.toggle('show',want);}
  var cY=Math.cos(ya),sY=Math.sin(ya),cP=Math.cos(pitch),sP=Math.sin(pitch);
  var cx=W/2,cy=H/2,formed=amp>0&&mode===0,k,e,fx,fy,fz,x1,z1,y2,z2,q,tw,sz0;
  ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';
  for(i=0;i<stars.length;i++){var st=stars[i];ctx.globalAlpha=.25+.35*Math.sin(time*1.3+st[3]);ctx.fillRect(st[0]*W,st[1]*H,st[2]*dpr,st[2]*dpr);}
  var gl=ctx.createRadialGradient(cx,cy,0,cx,cy,S*2.3);gl.addColorStop(0,'rgba(255,63,142,'+(.16+.16*beat*amp)+')');gl.addColorStop(1,'rgba(255,63,142,0)');ctx.globalAlpha=1;ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  for(i=0;i<fh.length;i++){var o=fh[i];o.p-=o.v*dt;if(o.p<-.1){o.p=1.1;o.x=Math.random();}
    var fd=Math.min(1,Math.max(0,o.p*3))*Math.min(1,(1.1-o.p)*4);
    ctx.globalAlpha=.55*fd;ctx.fillStyle=o.c;mini(o.x*W+Math.sin(time*.8+o.w)*22*dpr,o.p*H,o.s*dpr);}
  if(mode===1){var rk=Math.min(1,bt/.8);ctx.globalAlpha=(1-rk)*.8;ctx.strokeStyle='#ffb6d2';ctx.lineWidth=3*dpr;ctx.beginPath();ctx.arc(cx,cy,S*(.3+rk*3.2),0,6.2832);ctx.stroke();}
  for(i=0;i<N;i++){
    if(mode===1){k=Math.min(1,bt/.8);k=1-(1-k)*(1-k);fx=tx[i]+(sx[i]-tx[i])*k;fy=ty[i]+(sy[i]-ty[i])*k;fz=tz[i]+(sz[i]-tz[i])*k;}
    else{e=Math.max(0,Math.min(1,(el-dl[i])/2.8));k=(1-e);k=k*k*k;fx=(tx[i]+(sx[i]-tx[i])*k)*sc;fy=(ty[i]+(sy[i]-ty[i])*k)*sc;fz=(tz[i]+(sz[i]-tz[i])*k)*sc;}
    x1=fx*cY+fz*sY;z1=-fx*sY+fz*cY;
    y2=fy*cP-z1*sP;z2=fy*sP+z1*cP;
    q=D/(D-z2);
    px[i]=cx+x1*S*q;py[i]=cy+y2*S*q;
    tw=formed?.75+.45*Math.sin(time*(2+ph[i]*.5)+ph[i]*3):1;
    ps[i]=(bk[i]===0?1.9:1.3)*q*dpr*tw;
  }
  ctx.globalCompositeOperation='lighter';
  for(var b=0;b<6;b++){
    ctx.globalAlpha=alp[b];ctx.fillStyle=cols[b];ctx.beginPath();
    for(i=bs[b];i<bs[b+1];i++){sz0=ps[i];ctx.rect(px[i]-sz0/2,py[i]-sz0/2,sz0,sz0);}
    ctx.fill();
  }
  requestAnimationFrame(frame);
}

var bgm=document.getElementById('bgm'),sb=document.getElementById('song'),auto=false,userPaused=false;
function setBtn(){var on=!bgm.paused;sb.textContent=on?'\u275A\u275A Jeda lagu':'\u266A Putar lagu';sb.setAttribute('aria-pressed',on);}
sb.addEventListener('click',function(e){e.stopPropagation();auto=true;if(bgm.paused){userPaused=false;var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){});}else{userPaused=true;bgm.pause();}});
sb.addEventListener('pointerdown',function(e){e.stopPropagation();});
cv.addEventListener('pointerdown',function(){if(!auto&&!userPaused){auto=true;var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){});}});
bgm.addEventListener('play',setBtn);bgm.addEventListener('pause',setBtn);
requestAnimationFrame(frame);
})();
